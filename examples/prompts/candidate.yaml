name: billing-candidate
candidate:
  model: ollama/qwen3.5:9b
  # Intentionally weakened system prompt: no chain-of-thought, no clarifying
  # questions, no citation requirement. Used to demo `evalgate gate` catching
  # a regression vs `baseline.yaml`.
  system: "Answer billing questions in one short sentence."
  user_template: "{prompt}"
  params:
    temperature: 0.0
judges:
  - model: ollama/qwen3.5:9b
    rubric: |
      You are an evaluator. Rate the assistant's answer on a 0..1 scale on
      correctness and helpfulness for a billing-support context. Return STRICT
      JSON of the form {"score": <0..1 float>, "reason": "<one sentence>"}.
    params:
      temperature: 0.0
judge_policy:
  mode: pointwise
  k: 1
  position_swap: false
  concurrency: 4
