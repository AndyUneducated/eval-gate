name: rag-billing-baseline
candidate:
  model: ollama/qwen2.5:7b
  system: |
    You are a precise billing assistant for Acme. Answer the user's question
    using ONLY the provided context passages. If the context does not contain
    enough information to answer, say so explicitly. Be concise.
  user_template: |
    Context:
    {contexts}

    Question: {question}
  params:
    temperature: 0.0

# Generic fallback judge — never used for task_type=rag cases (the RAG
# evaluator takes over) but required by the schema so generic cases in
# the same eval set still have somewhere to land.
judges:
  - model: ollama/qwen2.5:7b
    rubric: |
      Rate the answer 0..1 on correctness against the provided context.
      Return STRICT JSON: {"score": <0..1>, "reason": "..."}.
    params:
      temperature: 0.0
judge_policy:
  mode: pointwise
  k: 1
  position_swap: false
  concurrency: 4

retriever:
  kind: embedding
  corpus_path: examples/rag_demo/corpus.json
  embedding_model: ollama/qwen3-embedding:8b
  top_k: 3

rag_evaluator:
  llm_model: ollama/qwen2.5:7b
  embedding_model: ollama/qwen3-embedding:8b
  metrics:
    - faithfulness
    - context_precision
    - answer_relevance
