name: rag-billing-candidate
# Deliberately weakened candidate: the system prompt no longer enforces
# "use only the context" and asks for a long, hedged answer. Faithfulness
# should drop (the model improvises beyond the provided context) and
# answer_relevance should also dip (verbose hedging).
candidate:
  model: ollama/qwen3.5:9b
  system: |
    You are a helpful billing assistant. Use the provided context as a
    starting point, but feel free to draw on general knowledge when helpful.
    Provide a thorough multi-paragraph answer.
  user_template: |
    Context:
    {contexts}

    Question: {question}
  params:
    temperature: 0.7

judges:
  - model: ollama/qwen3.5:9b
    rubric: |
      Rate the answer 0..1 on correctness against the provided context.
      Return STRICT JSON: {"score": <0..1>, "reason": "..."}.
    params:
      temperature: 0.0
judge_policy:
  mode: pointwise
  k: 1
  position_swap: false
  concurrency: 4

retriever:
  kind: embedding
  corpus_path: examples/rag_demo/corpus.json
  embedding_model: ollama/qwen3-embedding:8b
  top_k: 3

rag_evaluator:
  llm_model: ollama/qwen3.5:9b
  embedding_model: ollama/qwen3-embedding:8b
  metrics:
    - faithfulness
    - context_precision
    - answer_relevance
