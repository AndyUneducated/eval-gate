name: agent-baseline
candidate:
  model: ollama/qwen3.5:9b
  system: |
    You are an agent planner. Decide tool calls step by step and then provide
    a final answer. Always return strict JSON actions.
  user_template: |
    User question: {question}
  params:
    temperature: 0.0

# Generic evaluator fallback (unused for task_type=agent).
judges:
  - model: ollama/qwen3.5:9b
    rubric: |
      Rate the answer 0..1. Return STRICT JSON: {"score": <0..1>, "reason": "..."}.
    params:
      temperature: 0.0
judge_policy:
  mode: pointwise
  k: 1
  position_swap: false
  concurrency: 4

agent_runtime:
  max_steps: 4
  tool_names:
    - lookup_invoice
    - fetch_policy
    - get_payment_attempts
