[project]
name = "evalgate"
version = "0.1.0"
description = "Eval-First LLMOps platform with a multi-axis PR CI gate."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "AndyUneducated" }]
keywords = ["llm", "evaluation", "llmops", "ci", "opentelemetry"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "numpy>=2.1",
    "matplotlib>=3.9",
    "opentelemetry-proto>=1.30",
    "protobuf>=5",
    "litellm>=1.60",
    "pyyaml>=6",
    "ragas>=0.2,<0.4",
    "datasets>=2.14",
    "langchain-core>=0.3",
    "presidio-analyzer>=2.2,<3",
    "streamlit>=1.40",
    "httpx>=0.27",
]

[project.scripts]
evalgate = "evalgate.cli:main"
evalgate-api = "evalgate.api.main:run"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "pre-commit>=4.0",
    "aiosqlite>=0.20",
    "opentelemetry-api>=1.30",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evalgate"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["src/evalgate/db/migrations/versions"]

[tool.ruff.lint]
select = [
    "E", "W", # pycodestyle
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
    "N",      # pep8-naming
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific
]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802", "N806"]
# Streamlit's `pages/` convention uses a numeric prefix (1_Traces.py) to drive
# nav order — invalid Python module names by N999 but the only way to express it.
"src/evalgate/ui/pages/*.py" = ["N999"]
# Same story for the Home.py landing — Streamlit shows the entrypoint filename
# (minus `.py`) as the first sidebar tab, and `Home` is the conventional name.
"src/evalgate/ui/Home.py" = ["N999"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
