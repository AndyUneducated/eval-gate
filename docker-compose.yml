services:
  db:
    image: postgres:16-alpine
    container_name: evalgate-db
    environment:
      POSTGRES_USER: evalgate
      POSTGRES_PASSWORD: evalgate
      POSTGRES_DB: evalgate
    ports:
      # Host 5432 is often taken by a local Postgres; map to 5433 on the host.
      - "5433:5432"
    volumes:
      - evalgate-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evalgate -d evalgate"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: evalgate-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://evalgate:evalgate@db:5432/evalgate
      LOG_LEVEL: INFO
      ENV: docker
    ports:
      - "8000:8000"

volumes:
  evalgate-pgdata:
